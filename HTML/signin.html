<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastre-se</title>
    <link href="../CSS/bootstrap.min.css" rel="stylesheet">
  </head>

  <body class="bg-dark">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
          <div class="col-12 col-md-8 col-lg-5 col-xl-4">
              <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                  <div class="text-center mb-4">
                    <h2 class="fw-bold">Bem Vindo(a)!</h2>
                    <p class="text-secondary">Crie sua conta para continuar</p>
                  </div>
                  <div class="mb-4">
                      <form>
                          <div class="mb-3">
                              <label class="form-label fw-semibold">Nome Completo</label>
                              <input type="text" class="form-control form-control-lg" placeholder="Seu Nome Completo"/>
                          </div>
                          <div class="mb-3">
                              <label class="form-label fw-semibold">Email</label>
                              <input type="email" class="form-control form-control-lg" placeholder="exemplo@gmail.com"/>
                          </div>
                          <div class="text-start mb-3">
                              <div class="d-flex justify-content-between">
                                  <label class="form-label fw-semibold">Crie Uma Senha Forte</label>
                              </div>
                              <input type="password" class="form-control" placeholder="Digite sua senha"/>
                          </div>
                          <div class="text-start mb-4">
                              <div class="d-flex justify-content-between">
                                  <label class="form-label fw-semibold">Confirmar Senha</label>
                              </div>
                              <input type="password" class="form-control" placeholder="Digite sua senha novamente"/>
                          </div>
                          <div class="form-check mb-4">
                              <input type="checkbox" class="form-check-input" id="lembrar"/>
                              <label for="lembrar" class="form-check-label">lembrar mais tarde</label>
                          </div>
                          <button type="submit" class="btn btn-primary btn-lg w-100">Cadastre-se</button>
                      </form>
                  </div>
                  <div class="text-center">
                            <p class="mb-0 text-secondary small">Já tem uma conta?<a href="../HTML/login.html" class="text-decoration-none fw-semibold">Entrar</a></p>
                        </div>
                </div>
              </div>
              <p class="text-center text-white-50 small mt-4">Programação Dinâmica para Web</p>
          </div>
        </div>
    </div>
    <script src="../JS/bootstrap.bundle.min.js"></script>
  </body>
</html>
